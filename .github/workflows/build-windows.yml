name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "launcher.py"
      - "robust_resolver.py"
      - "requirements.txt"
      - "paper_downloader.spec"
      - "tests/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "launcher.py"
      - "robust_resolver.py"
      - "requirements.txt"
      - "paper_downloader.spec"
      - "tests/**"
      - ".github/workflows/build-windows.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Upload Churchill diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Churchill-v1.1-诊断报告
          path: churchill_v11_report.json
          if-no-files-found: warn

      - name: Build EXE
        run: pyinstaller --noconfirm --clean paper_downloader.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOI文献批量下载器-Windows
          path: dist/DOI文献批量下载器.exe
          if-no-files-found: error

      - name: Attach EXE to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DOI文献批量下载器.exe
